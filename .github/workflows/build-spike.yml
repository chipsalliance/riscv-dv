name: Spike Build

on:
  workflow_call:

jobs:
  spike:
    name: Build Spike
    runs-on: ubuntu-24.04
    env:
      TOOL_VERSION: d70ea67df7e85a8d92a8baa254afde67c33c43a9
      DEBIAN_FRONTEND: "noninteractive"

    steps:
      - name: Setup cache
        uses: actions/cache@v3
        id: cache
        with:
          path: /opt/spike
          key: cache_spike_${{ env.TOOL_VERSION }}

      - name: Install prerequisites
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt -qqy update && sudo apt -qqy --no-install-recommends install \
            git build-essential device-tree-compiler

      - name: Build Spike
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim --depth 1 --revision "$TOOL_VERSION" spike
          pushd spike
            mkdir build
            cd build
            ../configure --prefix=/opt/spike
            make -j`nproc`
            make install
          popd
          rm -rf /opt/spike/include # Remove include and lib to save space
          rm -rf /opt/spike/lib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spike
          path: /opt/spike

