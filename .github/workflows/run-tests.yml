name: run-tests

on:
  push:
  pull_request:

jobs:
  build-spike:
    uses: ./.github/workflows/build-spike.yml

  build-verilator:
    uses: ./.github/workflows/build-verilator.yml

  generate-config:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.test-types.outputs.targets }}
      target_tests: ${{ steps.test-types.outputs.target_tests }}
    steps:
      - uses: actions/checkout@v4
      - id: test-types
        name: Prepare test types
        run: |
          python3 -m venv .venv && source .venv/bin/activate
          python3 -m pip install pyyaml
          targets='["rv32i", "multi_harts", "rv32imc" ]'
          echo "targets=$targets" | tee -a $GITHUB_OUTPUT
          python3 .github/scripts/parse_testlist.py  $(echo $targets | jq -r '.[]') > target_tests.list
          echo "target_tests=$(cat target_tests.list)" | tee -a $GITHUB_OUTPUT

  build-generator:
    runs-on: ubuntu-24.04
    needs: [ generate-config, build-verilator ]
    strategy:
        fail-fast: false
        matrix:
          target: ${{ fromJSON(needs.generate-config.outputs.targets) }}
    env:
      UVM_VERSION: 578a46777ef0e0c9fa80e26d60ea4d100bb3cc84
      UVM_HOME: /opt/uvm-verilator
      CCACHE_DIR: /opt/generator/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /opt/generator/.ccache
          key: ccache_${{ matrix.target }}_${{ github.sha }}
          restore-keys: ccache_${{ matrix.target }}_

      - name: Download Verilator
        uses: actions/download-artifact@v4
        with:
          name: verilator
          path: /opt/verilator

      - name: Setup Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache build-essential mold
          echo "/opt/verilator/bin/" >> $GITHUB_PATH
          chmod +x /opt/verilator/bin/verilator /opt/verilator/bin/verilator_bin
          /opt/verilator/bin/verilator --version

      - name: Setup UVM
        run: |
          git clone https://github.com/antmicro/uvm-verilator --depth 1 --revision "$UVM_VERSION" $UVM_HOME

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          # python dependencies cannot be properly downloaded with new versions of python
          python-version: '3.9'
          cache: 'pip'
      - run: python3 -m pip install -r requirements.txt

      - name: Build Generator
        run: |
          set -eo pipefail
          python3 run.py --simulator verilator --co \
            --target ${{ matrix.target }} \
            -v -o out 2>&1 | tee test/build_generator.log

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: /opt/generator/.ccache
          key: ccache_${{ matrix.target }}_${{ github.sha }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator_${{ matrix.target }}
          path: |
            out/Vuvm
            test/build_generator.log

  run-tests:
    runs-on: ubuntu-24.04
    needs: [ build-spike, build-generator, generate-config ]
    if: ${{ !cancelled() && needs.build-spike.result == 'success' && needs.generate-config.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-config.outputs.target_tests) }}
    env:
      RISCV_GCC: riscv64-unknown-elf-gcc
      RISCV_OBJCOPY: riscv64-unknown-elf-objcopy
      SPIKE_PATH: /opt/spike/bin

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get -qqy update
          sudo apt-get -qqy install device-tree-compiler z3 gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version

      - name: Setup python
        # python dependencies cannot be properly downloaded with new versions of python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      - run: python3 -m pip install -r requirements.txt

      - name: Download spike
        uses: actions/download-artifact@v4
        with:
          name: spike
          path: /opt/spike

      - name: Download generator
        uses: actions/download-artifact@v4
        with:
          name: generator_${{ matrix.target }}

      - name: Run Tests
        run: |
          set -eo pipefail
          chmod +x out/Vuvm
          chmod +x /opt/spike/bin/spike
          python3 run.py \
            --target ${{ matrix.target }} --test ${{ matrix.test }} \
            --iss spike --iss_timeout 60 --gen_timeout 720 --start_seed 999 \
            --iterations 1 --batch_size 1 --noclean \
            --simulator verilator \
            --so -o out 2>&1 | tee -a test/generate.log

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run_tests_log_verilator_${{ matrix.target }}_${{ matrix.test }}
          path: |
            test/*.log
            out/**/${{ matrix.test }}*.log
